[package]
name = "desk-hookah"
version = "0.1.0"
description = "A tiny floating desktop hookah you pull with your hand"
authors = ["Shuvashis Gautam"]
license = "MIT"
edition = "2021"

[lib]
name = "desk_hookah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
